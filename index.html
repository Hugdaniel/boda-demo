<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javier & Erica — Invitación de Boda</title>

  <!-- Fuentes elegantes desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOADER CON MARCO ANIMADO -->
  <div id="loader">
    
    <!-- Marco contenedor principal -->
    <div class="loader-box">
      
      <!-- SVG que dibuja el borde púrpura -->
      <svg class="border-svg" width="100%" height="100%">
        <!-- El rectángulo ocupa todo el espacio del contenedor -->
        <rect class="border-rect" x="0" y="0" width="100%" height="100%" rx="16" ry="16" />
      </svg>

      <!-- Contenido dentro del marco -->
      <div class="loader-content">
        
       <!-- En el index.html, dentro de div.loader-content -->

<!-- Reemplazamos las letras por tu imagen de monograma -->
<div class="monogram-container">
  <img src="assets/monograma.svg" alt="Monograma Javier y Erica" class="monogram-img">
</div>

<p class="loader-phrase">Tenemos algo que contarte...</p>

      

        <button id="btn-revelar" class="btn-reveal">
          <span>!quiero saber!</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>

      </div>
    </div>

  </div>

 <!-- ==========================================
       PANTALLA 2: INVITACIÓN PRINCIPAL (HERO)
       ========================================== -->
  <main class="hero-section">
    
    <div class="hero-container">
      
      <!-- Contenedor Fila: Novio | Título | Novia -->
      <div class="hero-layout-grid">
        
        <!-- Novio (Entra por la izquierda) -->
        <div class="groom-wrapper">
          <img src="assets/javier.png" alt="Javier" class="couple-img groom-img" id="groom-photo">
        </div>

        <!-- Bloque del Título Central -->
        <div class="hero-text">
          <span class="hero-tagline">Nuestra Boda</span>
          <h1 class="hero-title">Javier <br><span class="ampersand-hero">&</span><br> Erica</h1>
          <p class="hero-date">12 . 10 . 2026</p>
        </div>

        <!-- Novia (Entra por la derecha) -->
        <div class="bride-wrapper">
          <img src="assets/erica.png" alt="Erica" class="couple-img bride-img" id="bride-photo">
        </div>

      </div>

    </div>

    <!-- Indicador de Scroll -->
    <div class="scroll-indicator" id="scroll-indicator">
      <span class="scroll-text">Deslizá para descubrir</span>
      <div class="mouse-icon">
        <div class="wheel"></div>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
